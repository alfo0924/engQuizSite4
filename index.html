<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English Quiz | Flat Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gradient-bg"></div>
<div class="container py-5 position-relative" style="z-index:2;">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h1 class="mb-3 text-center fw-bold">English Quiz</h1>
                    <div id="score-summary" class="mb-4 d-none"></div>
                    <div id="error-statistics" class="mb-4"></div>
                    <form id="quiz-form">
                        <div id="quiz-questions"></div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">Submit Answers</button>
                        </div>
                    </form>
                </div>
            </div>
            <footer class="text-center mt-4 text-white-50 small">© 2025 QuizSiteProducer</footer>
        </div>
    </div>
</div>
<script src="quiz.js"></script>
</body>
</html>
